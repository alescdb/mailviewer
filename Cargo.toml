[package]
name = "mailviewer"
version = "1.0.17"
edition = "2021"
authors = ["Alexandre Del Bigio"]
description = "GNOME eml and Outlook msg file viewer"
repository = "https://github.com/alescdb/mailviewer"
license = "GPL-3.0+"

[package.metadata.cargo-machete]
ignored = ["gettext-rs"]

[dependencies]
mailviewer-core = { git = "https://github.com/alescdb/mailviewer-core", branch = "main" }
webkit6 = "0.6"
gtk4 = { version = "0.11", features = ["v4_24", "blueprint"] }
log = "0.4"
env_logger = "0.11"
adw = { version = "0.9", features = ["v1_9"], package = "libadwaita" }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
