[package]
name = "mailviewer"
version = "1.0.12"
edition = "2021"
authors = ["Alexandre Del Bigio"]
description = "GNOME eml and Outlook msg file viewer"
readme = "README.md"
repository = "https://github.com/alescdb/mailviewer"
license = "GPL-3.0+"

[dependencies]
webkit6 = "0.6.1"
gmime = "0.8.1"
gtk4 = { version = "0.11.4", features = ["v4_22"] }
nipper = "0.1.9"
log = "0.4.33"
env_logger = "0.11.11"
base64 = "0.23.1"
adw = { version = "0.9.2", features = ["v1_9"], package = "libadwaita" }
ctor = "1.0.13"
dtor = "1.0.6"
msg_parser = "0.3.6"
uuid = { version = "1.24.1", features = ["v4"] }
lazy_static = "1.5.0"
hex = "0.4.3"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
hashbrown = "0.17.1"
encoding_rs = "0.8.35"
futures-util = "0.3.34"
